# Uptime-Check: prüft alle 30 Minuten, ob die Website erreichbar ist.
# Schlägt der Check fehl, schlägt der Workflow fehl → GitHub schickt
# automatisch eine E-Mail-Benachrichtigung an den Repo-Inhaber.
name: Uptime-Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Startseite prüfen
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.tradingwissen.ch/)
          echo "Status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::tradingwissen.ch antwortet mit HTTP $status"
            exit 1
          fi

      - name: Sitemap prüfen
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.tradingwissen.ch/sitemap-index.xml)
          echo "Status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Sitemap antwortet mit HTTP $status"
            exit 1
          fi
