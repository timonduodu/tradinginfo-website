<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSteu2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1b1b"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgSteu2)"/>
  <!-- Swiss cross subtle in background -->
  <g transform="translate(600, 300)" opacity="0.05">
    <rect x="-200" y="-50" width="400" height="100" fill="#ffffff"/>
    <rect x="-50" y="-200" width="100" height="400" fill="#ffffff"/>
  </g>
  <!-- Percentage breakdown circles -->
  <g transform="translate(250, 350)">
    <circle r="80" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>
    <circle r="80" fill="none" stroke="#d4af37" stroke-width="3"
            stroke-dasharray="251 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">35%</text>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">VERRECHNUNG</text>
  </g>
  <g transform="translate(600, 350)">
    <circle r="80" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>
    <circle r="80" fill="none" stroke="#1b7a3e" stroke-width="3"
            stroke-dasharray="100 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">15%</text>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">QUELLENSTEUER</text>
  </g>
  <g transform="translate(950, 350)">
    <circle r="80" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>
    <circle r="80" fill="none" stroke="#b91c1c" stroke-width="3"
            stroke-dasharray="200 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">30%</text>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">EINKOMMEN</text>
  </g>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">ABGABEN</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">STEUERN</text>
</svg>
