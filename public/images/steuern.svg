<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgSteuern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2d1b"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgSteuern)"/>
  <!-- Document stack illustration -->
  <g transform="translate(700, 100)">
    <!-- Back document -->
    <rect x="40" y="40" width="280" height="380" fill="#ffffff" fill-opacity="0.08" rx="4"/>
    <!-- Middle document -->
    <rect x="20" y="20" width="280" height="380" fill="#ffffff" fill-opacity="0.12" rx="4"/>
    <!-- Front document -->
    <rect x="0" y="0" width="280" height="380" fill="#ffffff" fill-opacity="0.95" rx="4"/>
    <!-- Document header -->
    <rect x="20" y="25" width="120" height="8" fill="#0a2540" rx="2"/>
    <rect x="20" y="45" width="80" height="6" fill="#0a2540" fill-opacity="0.5" rx="2"/>
    <!-- Lines -->
    <g fill="#0a2540" fill-opacity="0.3">
      <rect x="20" y="80" width="240" height="4" rx="1"/>
      <rect x="20" y="100" width="220" height="4" rx="1"/>
      <rect x="20" y="120" width="180" height="4" rx="1"/>
    </g>
    <!-- Table-like structure -->
    <g fill="#0a2540" fill-opacity="0.2">
      <rect x="20" y="160" width="240" height="20"/>
      <rect x="20" y="200" width="240" height="2"/>
      <rect x="20" y="225" width="240" height="2"/>
      <rect x="20" y="250" width="240" height="2"/>
      <rect x="20" y="275" width="240" height="2"/>
    </g>
    <g fill="#0a2540" fill-opacity="0.4">
      <rect x="30" y="167" width="60" height="6" rx="1"/>
      <rect x="100" y="167" width="50" height="6" rx="1"/>
      <rect x="160" y="167" width="50" height="6" rx="1"/>
      <rect x="220" y="167" width="40" height="6" rx="1"/>
    </g>
    <!-- Amount highlighted -->
    <rect x="20" y="305" width="240" height="30" fill="#d4af37" fill-opacity="0.2" rx="2"/>
    <rect x="30" y="315" width="80" height="10" fill="#0a2540" rx="1"/>
    <rect x="190" y="315" width="60" height="10" fill="#0a2540" rx="1"/>
    <!-- Stamp -->
    <circle cx="220" cy="370" r="20" fill="none" stroke="#b91c1c" stroke-width="2" opacity="0.6"/>
    <text x="220" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#b91c1c" opacity="0.7">CH</text>
  </g>
  <!-- Coins -->
  <g transform="translate(150, 350)">
    <circle cx="0" cy="0" r="35" fill="#d4af37" fill-opacity="0.8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-opacity="0.3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1a1a1a">CHF</text>
  </g>
  <g transform="translate(220, 380)">
    <circle cx="0" cy="0" r="28" fill="#d4af37" fill-opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1a1a1a">%</text>
  </g>
  <g transform="translate(280, 360)">
    <circle cx="0" cy="0" r="22" fill="#d4af37" fill-opacity="0.5"/>
  </g>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">DEKLARATION</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">STEUERN</text>
</svg>
