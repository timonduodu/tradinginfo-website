<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBrok2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgBrok2)"/>
  <!-- Vault-style design -->
  <g transform="translate(600, 300)">
    <circle r="180" fill="none" stroke="#d4af37" stroke-width="3" stroke-opacity="0.5"/>
    <circle r="140" fill="none" stroke="#d4af37" stroke-width="2" stroke-opacity="0.4"/>
    <circle r="100" fill="none" stroke="#d4af37" stroke-width="2" stroke-opacity="0.3"/>
    <circle r="60" fill="#d4af37" fill-opacity="0.15"/>
    <!-- Vault spokes -->
    <g stroke="#d4af37" stroke-width="2" stroke-opacity="0.6">
      <line x1="0" y1="-180" x2="0" y2="-100"/>
      <line x1="0" y1="180" x2="0" y2="100"/>
      <line x1="-180" y1="0" x2="-100" y2="0"/>
      <line x1="180" y1="0" x2="100" y2="0"/>
      <line x1="-127" y1="-127" x2="-71" y2="-71"/>
      <line x1="127" y1="127" x2="71" y2="71"/>
      <line x1="-127" y1="127" x2="-71" y2="71"/>
      <line x1="127" y1="-127" x2="71" y2="-71"/>
    </g>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#d4af37">CHF</text>
  </g>
  <!-- Currency symbols floating -->
  <g font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.1">
    <text x="150" y="200" font-size="60" font-weight="700">$</text>
    <text x="250" y="450" font-size="50" font-weight="700">€</text>
    <text x="900" y="180" font-size="55" font-weight="700">£</text>
    <text x="1000" y="450" font-size="65" font-weight="700">¥</text>
  </g>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">DEPOT</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">BROKER</text>
</svg>
