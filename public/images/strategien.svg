<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgStrategien" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a3a"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgStrategien)"/>
  <!-- Network of strategy points -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <line x1="100" y1="100" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="700" y2="150"/>
    <line x1="700" y1="150" x2="1000" y2="250"/>
    <line x1="100" y1="100" x2="300" y2="400"/>
    <line x1="300" y1="400" x2="600" y2="450"/>
    <line x1="600" y1="450" x2="900" y2="400"/>
    <line x1="900" y1="400" x2="1000" y2="250"/>
    <line x1="400" y1="200" x2="600" y2="450"/>
    <line x1="700" y1="150" x2="900" y2="400"/>
    <line x1="300" y1="400" x2="700" y2="150"/>
  </g>
  <!-- Strategy nodes -->
  <g>
    <circle cx="100" cy="100" r="8" fill="#d4af37"/>
    <circle cx="400" cy="200" r="12" fill="#1b7a3e"/>
    <circle cx="700" cy="150" r="10" fill="#d4af37"/>
    <circle cx="1000" cy="250" r="14" fill="#1b7a3e"/>
    <circle cx="300" cy="400" r="10" fill="#d4af37"/>
    <circle cx="600" cy="450" r="14" fill="#1b7a3e"/>
    <circle cx="900" cy="400" r="8" fill="#d4af37"/>
  </g>
  <!-- Pulse rings -->
  <circle cx="400" cy="200" r="12" fill="none" stroke="#1b7a3e" stroke-width="2" opacity="0.4">
    <animate attributeName="r" from="12" to="40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.4" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="450" r="14" fill="none" stroke="#1b7a3e" stroke-width="2" opacity="0.4">
    <animate attributeName="r" from="14" to="40" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.4" to="0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">SYSTEM</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">STRATEGIEN</text>
</svg>
