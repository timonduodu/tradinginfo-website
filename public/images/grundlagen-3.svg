<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrund3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGrund3)"/>
  <!-- Order book visualization -->
  <g transform="translate(60, 180)">
    <!-- Bid side (green, links) -->
    <g>
      <rect x="0" y="0" width="500" height="30" fill="#1b7a3e" fill-opacity="0.7"/>
      <rect x="0" y="40" width="400" height="30" fill="#1b7a3e" fill-opacity="0.55"/>
      <rect x="0" y="80" width="320" height="30" fill="#1b7a3e" fill-opacity="0.4"/>
      <rect x="0" y="120" width="250" height="30" fill="#1b7a3e" fill-opacity="0.3"/>
      <rect x="0" y="160" width="180" height="30" fill="#1b7a3e" fill-opacity="0.2"/>
      <!-- Prices -->
      <g font-family="Courier New, monospace" font-size="14" fill="#ffffff" fill-opacity="0.9">
        <text x="10" y="20">92.50</text>
        <text x="10" y="60">92.49</text>
        <text x="10" y="100">92.48</text>
        <text x="10" y="140">92.47</text>
        <text x="10" y="180">92.46</text>
      </g>
      <g font-family="Courier New, monospace" font-size="13" fill="#ffffff" fill-opacity="0.7" text-anchor="end">
        <text x="490" y="20">1'200</text>
        <text x="390" y="60">3'500</text>
        <text x="310" y="100">5'000</text>
        <text x="240" y="140">8'200</text>
        <text x="170" y="180">12'000</text>
      </g>
    </g>
  </g>
  <g transform="translate(640, 180)">
    <!-- Ask side (red, rechts) -->
    <g>
      <rect x="0" y="0" width="300" height="30" fill="#b91c1c" fill-opacity="0.7"/>
      <rect x="0" y="40" width="380" height="30" fill="#b91c1c" fill-opacity="0.55"/>
      <rect x="0" y="80" width="450" height="30" fill="#b91c1c" fill-opacity="0.4"/>
      <rect x="0" y="120" width="500" height="30" fill="#b91c1c" fill-opacity="0.3"/>
      <rect x="0" y="160" width="480" height="30" fill="#b91c1c" fill-opacity="0.2"/>
      <!-- Prices -->
      <g font-family="Courier New, monospace" font-size="14" fill="#ffffff" fill-opacity="0.9">
        <text x="10" y="20">92.54</text>
        <text x="10" y="60">92.55</text>
        <text x="10" y="100">92.56</text>
        <text x="10" y="140">92.57</text>
        <text x="10" y="180">92.58</text>
      </g>
      <g font-family="Courier New, monospace" font-size="13" fill="#ffffff" fill-opacity="0.7">
        <text x="80" y="20">800</text>
        <text x="80" y="60">2'100</text>
        <text x="80" y="100">4'800</text>
        <text x="80" y="140">10'500</text>
        <text x="80" y="180">15'000</text>
      </g>
    </g>
  </g>
  <!-- Spread indicator -->
  <line x1="580" y1="160" x2="580" y2="430" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="640" y1="160" x2="640" y2="430" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="610" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d4af37" letter-spacing="2">SPREAD</text>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">ORDERBUCH</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">GRUNDLAGEN</text>
</svg>
