      <rect x="290" y="210" width="10" height="15"/>
      <rect x="230" y="250" width="10" height="15"/>
      <rect x="270" y="250" width="10" height="15"/>
      <rect x="290" y="250" width="10" height="15"/>
      <rect x="230" y="290" width="10" height="15"/>
      <rect x="250" y="290" width="10" height="15"/>
      <rect x="290" y="290" width="10" height="15"/>
      <rect x="250" y="330" width="10" height="15"/>
