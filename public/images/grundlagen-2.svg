<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrund2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#2d1b3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgGrund2)"/>
  <!-- Big numbers floating -->
  <g font-family="Georgia, serif" font-weight="700" fill="#ffffff">
    <text x="120" y="180" font-size="80" fill-opacity="0.08">100%</text>
    <text x="350" y="280" font-size="120" fill-opacity="0.1">$</text>
    <text x="500" y="160" font-size="60" fill-opacity="0.08">+15%</text>
    <text x="700" y="350" font-size="100" fill-opacity="0.06">€</text>
    <text x="900" y="200" font-size="70" fill-opacity="0.08">0.05</text>
    <text x="200" y="450" font-size="55" fill-opacity="0.07">CHF</text>
    <text x="600" y="500" font-size="65" fill-opacity="0.08">1.2x</text>
    <text x="950" y="450" font-size="80" fill-opacity="0.06">π</text>
  </g>
  <!-- Mathematical curves -->
  <g stroke="#d4af37" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M 0,400 Q 200,300 400,350 T 800,250 T 1200,300"/>
    <path d="M 0,500 Q 300,450 600,470 T 1200,420" stroke-dasharray="5,5"/>
  </g>
  <!-- Bar chart elements -->
  <g fill="#1b7a3e" fill-opacity="0.4">
    <rect x="60" y="500" width="40" height="80"/>
    <rect x="110" y="470" width="40" height="110"/>
    <rect x="160" y="490" width="40" height="90"/>
    <rect x="210" y="445" width="40" height="135"/>
  </g>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">ZAHLEN</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">GRUNDLAGEN</text>
</svg>
