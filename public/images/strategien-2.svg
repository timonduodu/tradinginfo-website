<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgStrat2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3a2a"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bgStrat2)"/>
  <!-- Multiple trend lines -->
  <g fill="none" stroke-width="3">
    <!-- Trend up -->
    <path d="M 50,500 Q 200,460 400,400 T 700,250 T 1000,150 T 1180,100"
          stroke="#1b7a3e" stroke-opacity="0.8"/>
    <!-- Mean reversion -->
    <path d="M 50,300 Q 150,250 250,350 T 450,300 T 650,350 T 850,250 T 1050,350 T 1180,300"
          stroke="#d4af37" stroke-opacity="0.6"/>
    <!-- Volatility -->
    <path d="M 50,450 L 150,400 L 250,500 L 350,380 L 450,520 L 550,420 L 650,480 L 750,400 L 850,510 L 950,420 L 1050,470 L 1150,440"
          stroke="#b91c1c" stroke-opacity="0.5"/>
  </g>
  <!-- Legend boxes -->
  <g transform="translate(750, 470)">
    <rect x="0" y="0" width="380" height="110" fill="#ffffff" fill-opacity="0.05" rx="4"/>
    <line x1="20" y1="30" x2="60" y2="30" stroke="#1b7a3e" stroke-width="3"/>
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.85">Trendfolge</text>
    <line x1="20" y1="60" x2="60" y2="60" stroke="#d4af37" stroke-width="3"/>
    <text x="75" y="65" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.85">Mean Reversion</text>
    <line x1="20" y1="90" x2="60" y2="90" stroke="#b91c1c" stroke-width="3"/>
    <text x="75" y="95" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.85">Volatilität</text>
  </g>
  <!-- Label -->
  <text x="60" y="80" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" fill-opacity="0.9">METHODEN</text>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" letter-spacing="2">STRATEGIEN</text>
</svg>
